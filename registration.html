        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #e3f2fd 100%);
            min-height: 100vh;
            padding: 30px 0;
        }
        .progress-bar-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .progress-step {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background-color: #dee2e6;
            color: #6c757d;
            position: relative;
        }
        .progress-step.active {
            background-color: #0d6efd;
            color: white;
        }
        .progress-step.completed {
            background-color: #28a745;
            color: white;
        }
        .progress-line {
            flex: 1;
            height: 3px;
            background-color: #dee2e6;
            margin: 0 10px;
        }
        .progress-line.completed {
            background-color: #28a745;
        }
        .step-label {
            font-size: 11px;
            color: #6c757d;
            margin-top: 5px;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: none;
        }
        .btn-custom {
            padding: 12px 30px;
            font-weight: 600;
        }
        .payment-info {
            background-color: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 8px;
            padding: 20px;
        }
        .qr-placeholder {
            width: 150px;
            height: 150px;
            /*background-color: #f8f9fa;*/
            /*border: 2px dashed #dee2e6;*/
            display: flex;
            align-items: center;
            justify-content: center;
            /*border-radius: 8px;*/
            /*color: #6c757d;*/
        }
        .review-section {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .form-control.is-invalid {
            border-color: #dc3545;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentStep = 1;
        const totalSteps = 5;

        // Update hidden session field when radio changes
        document.querySelectorAll('input[name="sessionRadio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.getElementById('sessionValue').value = this.value;
            });
        });

        function showStep(step) {
            // Hide all steps
            document.querySelectorAll('.form-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // Show current step
            document.getElementById('step-' + step).classList.add('active');
            
            // Update progress indicators
            for (let i = 1; i <= totalSteps; i++) {
                const stepIndicator = document.getElementById('step-indicator-' + i);
                if (i < step) {
                    stepIndicator.classList.remove('active');
                    stepIndicator.classList.add('completed');
                    stepIndicator.innerHTML = '<i class="bi bi-check"></i>';
                } else if (i === step) {
                    stepIndicator.classList.remove('completed');
                    stepIndicator.classList.add('active');
                    stepIndicator.textContent = i;
                } else {
                    stepIndicator.classList.remove('active', 'completed');
                    stepIndicator.textContent = i;
                }
                
                // Update progress lines
                if (i < totalSteps) {
                    const line = document.getElementById('line-' + i);
                    if (i < step) {
                        line.classList.add('completed');
                    } else {
                        line.classList.remove('completed');
                    }
                }
            }
            
            // Update buttons
            document.getElementById('prevBtn').style.display = step === 1 ? 'none' : 'inline-block';
            document.getElementById('nextBtn').style.display = step === totalSteps ? 'none' : 'inline-block';
            document.getElementById('submitBtn').style.display = step === totalSteps ? 'inline-block' : 'none';
            
            // If on review step, populate review data
            if (step === 5) {
                populateReview();
            }
        }

        function validateStep(step) {
            let isValid = true;
            
            // Clear all previous errors
            document.querySelectorAll('.error-message').forEach(error => {
                error.style.display = 'none';
            });
            document.querySelectorAll('.is-invalid').forEach(input => {
                input.classList.remove('is-invalid');
            });

            if (step === 1) {
                const firstName = document.getElementById('firstName');
                const lastName = document.getElementById('lastName');
                const email = document.getElementById('email');
                const mobile = document.getElementById('mobile');

                if (!firstName.value.trim()) {
                    showError('firstName');
                    isValid = false;
                }
                if (!lastName.value.trim()) {
                    showError('lastName');
                    isValid = false;
                }
                if (!email.value.trim() || !email.value.match(/\S+@\S+\.\S+/)) {
                    showError('email');
                    isValid = false;
                }
                if (!mobile.value.trim() || mobile.value.length !== 10 || !/^\d{10}$/.test(mobile.value)) {
                    showError('mobile');
                    isValid = false;
                }
            }

            if (step === 2) {
                const session = document.querySelector('input[name="sessionRadio"]:checked');
                const homeClub = document.getElementById('homeClub');
                const handicap = document.getElementById('handicap');
                const previousParticipation = document.querySelector('input[name="previousParticipation"]:checked');

                if (!session) {
                    showError('session');
                    isValid = false;
                }
                if (!homeClub.value.trim()) {
                    showError('homeClub');
                    isValid = false;
                }
                if (!handicap.value.trim()) {
                    showError('handicap');
                    isValid = false;
                }
                if (!previousParticipation) {
                    showError('previousParticipation');
                    isValid = false;
                }
            }

            if (step === 3) {
                const shoeSize = document.getElementById('shoeSize');
                const tshirtSize = document.getElementById('tshirtSize');

                if (!shoeSize.value.trim()) {
                    showError('shoeSize');
                    isValid = false;
                }
                if (!tshirtSize.value) {
                    showError('tshirtSize');
                    isValid = false;
                }
            }

            if (step === 4) {
                const paymentDate = document.getElementById('paymentDate');
                const paymentReference = document.getElementById('paymentReference');

                if (!paymentDate.value) {
                    showError('paymentDate');
                    isValid = false;
                }
                if (!paymentReference.value.trim()) {
                    showError('paymentReference');
                    isValid = false;
                }
            }

            return isValid;
        }

        function showError(fieldId) {
            const errorElement = document.getElementById('error-' + fieldId);
            const inputElement = document.getElementById(fieldId);
            
            if (errorElement) {
                errorElement.style.display = 'block';
            }
            if (inputElement) {
                inputElement.classList.add('is-invalid');
            }
        }

        function changeStep(direction) {
            if (direction === 1) {
                if (!validateStep(currentStep)) {
                    return;
                }
            }
            
            const newStep = currentStep + direction;
            if (newStep >= 1 && newStep <= totalSteps) {
                currentStep = newStep;
                showStep(currentStep);
            }
        }

        function populateReview() {
            document.getElementById('review-firstName').textContent = document.getElementById('firstName').value;
            document.getElementById('review-lastName').textContent = document.getElementById('lastName').value;
            document.getElementById('review-email').textContent = document.getElementById('email').value;
            document.getElementById('review-mobile').textContent = document.getElementById('mobile').value;

            const selectedSession = document.querySelector('input[name="sessionRadio"]:checked');
            document.getElementById('review-session').textContent = selectedSession ? selectedSession.value : '';
            
            document.getElementById('review-homeClub').textContent = document.getElementById('homeClub').value;
            document.getElementById('review-handicap').textContent = document.getElementById('handicap').value;
            
            const previousParticipation = document.querySelector('input[name="previousParticipation"]:checked');
            document.getElementById('review-previousParticipation').textContent = previousParticipation ? previousParticipation.value : '';

            document.getElementById('review-shoeSize').textContent = document.getElementById('shoeSize').value;
            document.getElementById('review-tshirtSize').textContent = document.getElementById('tshirtSize').value;
            
            const comments = document.getElementById('comments').value;
            if (comments) {
                document.getElementById('review-comments-section').style.display = 'block';
                document.getElementById('review-comments').textContent = comments;
            } else {
                document.getElementById('review-comments-section').style.display = 'none';
            }

            document.getElementById('review-paymentDate').textContent = document.getElementById('paymentDate').value;
            document.getElementById('review-paymentReference').textContent = document.getElementById('paymentReference').value;
        }

        // Initialize
        showStep(1);
    </script>
